<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zamonaviy Ilmiy Kalkulyator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-app">
        <!-- Kalkulyator konteyneri -->
        <main class="calculator-card">
            <!-- Yuqori qism: rejimlar va panel boshqaruvi -->
            <header class="calc-header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">SCIENTIFIC</span>
                </div>
                <div class="header-controls">
                    <button type="button" id="angle-mode-btn" class="badge-btn" aria-label="Burchak rejimi: Radian yoki Gradus">
                        <span id="angle-mode-text">DEG</span>
                    </button>
                    <button type="button" id="history-toggle-btn" class="icon-btn" title="Tarix" aria-label="Hisob-kitoblar tarixi">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Displey zonasi -->
            <section class="display-panel" id="display-panel" title="Nusxalash uchun bosing">
                <div class="status-bar">
                    <span class="status-badge" id="memory-indicator"></span>
                    <span class="status-badge" id="angle-indicator">DEG</span>
                </div>
                <div class="expression-line" id="expression-display">0</div>
                <div class="current-line" id="primary-display">0</div>
            </section>

            <!-- Asosiy tugmalar paneli -->
            <div class="keypad-container">
                <!-- Xotira qatori -->
                <div class="memory-row">
                    <button type="button" class="btn btn-mem" data-action="mem-clear">MC</button>
                    <button type="button" class="btn btn-mem" data-action="mem-recall">MR</button>
                    <button type="button" class="btn btn-mem" data-action="mem-plus">M+</button>
                    <button type="button" class="btn btn-mem" data-action="mem-minus">M−</button>
                    <button type="button" class="btn btn-mem" data-action="ans">ANS</button>
                </div>

                <!-- Ilmiy funksiyalar paneli -->
                <div class="scientific-grid">
                    <button type="button" class="btn btn-sci" data-action="2nd" id="btn-2nd">2<sup>nd</sup></button>
                    <button type="button" class="btn btn-sci" data-func="sin" id="btn-sin">sin</button>
                    <button type="button" class="btn btn-sci" data-func="cos" id="btn-cos">cos</button>
                    <button type="button" class="btn btn-sci" data-func="tan" id="btn-tan">tan</button>
                    <button type="button" class="btn btn-sci" data-insert="^">x<sup>y</sup></button>

                    <button type="button" class="btn btn-sci" data-func="ln">ln</button>
                    <button type="button" class="btn btn-sci" data-func="log">log</button>
                    <button type="button" class="btn btn-sci" data-func="sqrt">√</button>
                    <button type="button" class="btn btn-sci" data-insert="^2">x²</button>
                    <button type="button" class="btn btn-sci" data-func="fact">x!</button>

                    <button type="button" class="btn btn-sci" data-insert="π">π</button>
                    <button type="button" class="btn btn-sci" data-insert="e">e</button>
                    <button type="button" class="btn btn-sci" data-func="inv">1/x</button>
                    <button type="button" class="btn btn-sci" data-insert="(">(</button>
                    <button type="button" class="btn btn-sci" data-insert=")">)</button>
                </div>

                <!-- Standart raqamlar va amallar paneli -->
                <div class="standard-grid">
                    <button type="button" class="btn btn-action btn-clear" data-action="clear">AC</button>
                    <button type="button" class="btn btn-action btn-delete" data-action="delete" aria-label="O'chirish">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                            <line x1="18" y1="9" x2="12" y2="15"></line>
                            <line x1="12" y1="9" x2="18" y2="15"></line>
                        </svg>
                    </button>
                    <button type="button" class="btn btn-sci" data-action="percent">%</button>
                    <button type="button" class="btn btn-op" data-operator="÷">÷</button>

                    <button type="button" class="btn btn-num" data-number="7">7</button>
                    <button type="button" class="btn btn-num" data-number="8">8</button>
                    <button type="button" class="btn btn-num" data-number="9">9</button>
                    <button type="button" class="btn btn-op" data-operator="×">×</button>

                    <button type="button" class="btn btn-num" data-number="4">4</button>
                    <button type="button" class="btn btn-num" data-number="5">5</button>
                    <button type="button" class="btn btn-num" data-number="6">6</button>
                    <button type="button" class="btn btn-op" data-operator="−">−</button>

                    <button type="button" class="btn btn-num" data-number="1">1</button>
                    <button type="button" class="btn btn-num" data-number="2">2</button>
                    <button type="button" class="btn btn-num" data-number="3">3</button>
                    <button type="button" class="btn btn-op" data-operator="+">+</button>

                    <button type="button" class="btn btn-sci" data-action="negate">±</button>
                    <button type="button" class="btn btn-num" data-number="0">0</button>
                    <button type="button" class="btn btn-num" data-number=".">.</button>
                    <button type="button" class="btn btn-equals" data-action="equals">=</button>
                </div>
            </div>

            <!-- Tarix yon paneli (Modal/Drawer) -->
            <aside class="history-drawer" id="history-drawer">
                <div class="drawer-header">
                    <h3>Hisoblar Tarixi</h3>
                    <div class="drawer-actions">
                        <button type="button" id="clear-history-btn" class="text-btn" title="Tarixni tozalash">Tozalash</button>
                        <button type="button" id="close-history-btn" class="icon-btn" aria-label="Yopish">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="history-list" id="history-list">
                    <div class="empty-history">Hozircha hisoblar mavjud emas</div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Bildirishnoma (Toast) -->
    <div class="toast" id="toast">Nusxalandi!</div>

    <script src="script.js"></script>
</body>
</html>
